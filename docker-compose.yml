services:

  # ── Base de datos MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: clinguard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: clinica_db
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicación Spring Boot ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinguard-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/clinica_db
      JWT_SECRET: C2mV9xKqP7nRtYwLdHsJbFzAeUiOgMkX
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
