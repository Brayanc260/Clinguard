<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClinGuard — Error</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.12), transparent 35%),
                linear-gradient(135deg, #07111f, #0d1727);

            color: #f8fafc;
        }

        .error-card {
            width: 100%;
            max-width: 560px;
            padding: 50px 40px;
            text-align: center;

            background: rgba(15, 23, 42, 0.93);

            border: 1px solid rgba(148, 163, 184, 0.16);

            border-radius: 24px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .logo span {
            color: #38bdf8;
        }

        .icon {
            width: 95px;
            height: 95px;

            margin: 0 auto 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 25px;

            background: rgba(56, 189, 248, 0.1);

            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .icon i {
            font-size: 52px;
            color: #38bdf8;
        }

        h1 {
            font-size: 70px;
            line-height: 1;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 14px;
        }

        p {
            max-width: 450px;
            margin: auto;
            line-height: 1.7;

            color: #94a3b8;

            font-size: 15px;
        }

        .actions {
            margin-top: 32px;

            display: flex;
            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;
        }

        .btn {
            min-height: 46px;

            padding: 0 20px;

            border-radius: 12px;

            border: none;

            display: inline-flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            cursor: pointer;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: .2s ease;
        }

        .btn-primary {
            background: #38bdf8;
            color: #07111f;
        }

        .btn-primary:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);

            color: #e2e8f0;

            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);

            transform: translateY(-2px);
        }

        .btn i {
            font-size: 19px;
        }

        @media (max-width: 600px) {

            .error-card {
                padding: 38px 22px;
            }

            h1 {
                font-size: 58px;
            }

            h2 {
                font-size: 22px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="error-card">

    <div class="logo">
        Clin<span>Guard</span>
    </div>

    <div class="icon">
        <i class='bx bx-error-circle'></i>
    </div>

    <h1 th:text="${codigo != null ? codigo : 'Error'}">
        Error
    </h1>

    <h2>Ha ocurrido un inconveniente</h2>

    <p th:text="${mensaje != null
            ? mensaje
            : 'No fue posible completar la operación solicitada.'}">

        No fue posible completar la operación solicitada.

    </p>

    <div class="actions">

        <a th:href="@{/dashboard}"
           class="btn btn-primary">

            <i class='bx bx-home'></i>
            Ir al inicio

        </a>

        <button type="button"
                onclick="history.back()"
                class="btn btn-secondary">

            <i class='bx bx-arrow-back'></i>
            Regresar

        </button>

    </div>

</div>

</body>
</html>
