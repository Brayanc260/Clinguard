<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>405 · Método no permitido | ClinGuard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
          --bg1: #0F172A;
          --bg2: #111827;
          --bg3: #1E293B;
          --border: #334155;
          --text1: #F8FAFC;
          --text2: #94A3B8;
          --accent: #38BDF8;
          --accent-hover: #0EA5E9;
          --accent-dim: rgba(56, 189, 248, 0.12);
          --safe: #22C55E;
          --warn: #F59E0B;
          --danger: #F43F5E;
          --suggest: #A78BFA;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
          min-height: 100vh;
          background: var(--bg1);
          color: var(--text1);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
        }

        .error-card {
          width: 100%;
          max-width: 560px;
          padding: 40px;
          text-align: center;
          background: var(--bg2);
          border: 1px solid var(--border);
          border-radius: 16px;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.30);
        }

        .brand {
          margin-bottom: 30px;
          color: var(--text1);
          font-size: 24px;
          font-weight: 700;
        }

        .brand span {
          color: var(--accent);
        }

        .code {
          margin-bottom: 18px;
          color: var(--status-color);
          font-family: 'DM Mono', monospace;
          font-size: clamp(72px, 16vw, 120px);
          font-weight: 600;
          line-height: 1;
          letter-spacing: -4px;
        }

        .status {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
          padding: 6px 11px;
          color: var(--status-color);
          font-family: 'DM Mono', monospace;
          font-size: 11px;
          font-weight: 600;
          background: var(--status-bg);
          border: 1px solid var(--status-border);
          border-radius: 999px;
        }

        h1 {
          margin-bottom: 12px;
          color: var(--text1);
          font-size: 25px;
          font-weight: 700;
        }

        p {
          max-width: 470px;
          margin: 0 auto 28px;
          color: var(--text2);
          font-size: 14px;
          line-height: 1.7;
        }

        .actions {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 12px;
        }

        .btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 44px;
          padding: 10px 18px;
          border-radius: 8px;
          font-size: 14px;
          font-weight: 600;
          text-decoration: none;
          transition: 0.2s;
        }

        .btn-primary {
          color: #0F172A;
          background: var(--accent);
          border: 1px solid var(--accent);
        }

        .btn-primary:hover {
          background: var(--accent-hover);
          border-color: var(--accent-hover);
          transform: translateY(-1px);
        }

        .btn-sec {
          color: var(--text1);
          background: var(--bg3);
          border: 1px solid var(--border);
        }

        .btn-sec:hover {
          color: var(--accent);
          border-color: var(--accent);
          background: var(--accent-dim);
        }

        .footer-note {
          margin-top: 26px;
          color: var(--text2);
          font-family: 'DM Mono', monospace;
          font-size: 11px;
        }

        @media (max-width: 520px) {
          .error-card {
            padding: 30px 20px;
          }

          .actions {
            flex-direction: column;
          }

          .btn {
            width: 100%;
          }
        }

    .error-card {
      --status-color: #F43F5E;
      --status-bg: rgba(244, 63, 94, 0.12);
      --status-border: rgba(244, 63, 94, 0.35);
    }
  </style>
</head>

<body>
  <main class="error-card">
    <div class="brand">ClinGuard<span>•</span></div>

    <div class="code">405</div>
    <div class="status">HTTP 405 · Method Not Allowed</div>

    <h1>Método no permitido</h1>
    <p>La ruta existe, pero el método HTTP utilizado no está permitido para esta operación.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/" th:href="@{/}">
        Ir al inicio
      </a>

      <a class="btn btn-sec" href="javascript:history.back()">
        Volver
      </a>
    </div>

    <div class="footer-note">ClinGuard · Clinical Decision Support System</div>
  </main>
</body>
</html>
