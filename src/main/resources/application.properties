# =====================================================
# CLINGUARD - CONFIGURACION GENERAL
# =====================================================

# -----------------------------------------------------
# SERVIDOR
# -----------------------------------------------------
server.port=8080

# -----------------------------------------------------
# MONGODB ATLAS
# -----------------------------------------------------
# Conexion directa a MongoDB mediante IPv4
spring.data.mongodb.uri=mongodb+srv://Admin_Clinguard:Brcamilo052606@brcamilo.k9ovmwy.mongodb.net/clinica_db?retryWrites=true&w=majority
server.forward-headers-strategy=framework
server.use-forward-headers=true
# -----------------------------------------------------
# SEGURIDAD JWT
# -----------------------------------------------------
# Clave secreta definida como variable de entorno
app.jwt.secret=${JWT_SECRET}

# Tiempo de expiracion del JWT: 24 horas
app.jwt.expiration-ms=86400000

# Cookie JWT para desarrollo local HTTP
# En produccion con HTTPS cambiar a true
app.jwt.cookie-secure=false

# -----------------------------------------------------
# THYMELEAF
# -----------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# -----------------------------------------------------
# SESIONES WEB Y COOKIES
# -----------------------------------------------------
# Sesion web tradicional: 15 minutos
server.servlet.session.timeout=15m

# Nombre de cookie para sesiones Spring Security
server.servlet.session.cookie.name=CLINGUARDSESSION

# Seguridad de cookie de sesion
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Desarrollo local HTTP
# En produccion con HTTPS cambiar a true
server.servlet.session.cookie.secure=false

# -----------------------------------------------------
# CODIFICACION UTF-8
# -----------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# -----------------------------------------------------
# LOGS DE MONGODB
# -----------------------------------------------------
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
server.forward-headers-strategy=framework
server.use-forward-headers=true
